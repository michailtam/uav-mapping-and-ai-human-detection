planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0  # How often to replan if needed
    use_sim_time:  true
    planner_plugins:  ["GridBased"]
    
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown:  true  # Important for drones - can fly over unknown areas
      
# GLOBAL COSTMAP CONFIGURATION
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  # Hz - how often to update costmap
      publish_frequency: 1.0  # Hz - how often to publish for visualization
      global_frame: map  # Reference frame
      robot_base_frame: x650_0/base_footprint
      use_sim_time: true
      
      # Footprint for drone (circular is typical for omnidirectional drones)
      # Option 1: Radius (simpler)
      robot_radius: 0.3  # meters - adjust to your drone's size + safety margin
      
      # Option 2: Polygon footprint (for non-circular drones)
      # footprint:  "[[0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3]]"
      
      resolution: 0.05  # meters/cell - must match SLAM map resolution
      track_unknown_space: true
      rolling_window: false  # Global costmap covers entire map
      width: 50  # meters - initial size (expands with map)
      height: 50
      origin_x: -25.0  # Center the initial costmap
      origin_y: -25.0
      
      plugins:  ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # STATIC LAYER - The map from SLAM
      static_layer: 
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.5  # Increase for drones (wind effects)
        
      # OBSTACLE LAYER - Real-time sensor data
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources:  scan  # Add more if you have multiple sensors
        
        scan:
          topic: /scan
          max_obstacle_height: 2.0  # Adjust for drone flight height
          min_obstacle_height: 0.0  # Detect ground obstacles
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0  # Should match max_laser_range in SLAM
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
          
      # INFLATION LAYER - Safety buffer around obstacles
      inflation_layer: 
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0  # Lower = more gradual cost increase (better for drones)
        inflation_radius: 0.8  # meters - safety margin around obstacles
        # For drones:  Can be smaller than ground robots since drones have better maneuverability
        
      always_send_full_costmap: true